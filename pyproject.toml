[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-rea"
version = "0.1.0"
description = "Local Kagura protection and mandatory REA recovery evaluation"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
anti-rea = "antirea.cli:main"
anti-rea-defense = "antirea.defense_mcp:main"

[tool.setuptools.packages.find]
include = ["antirea*"]

